[package]
name = "speakup"
version = "2.2.1"
edition = "2024"
rust-version = "1.88"
description = "6개월 일본어 듣기·말하기 완성 – 음성 지원 일본어 학습 데스크톱 앱 (Claude API)"
license = "MIT"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts"] }
egui = "0.31"
cpal = "0.15"
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
whisper-rs = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
anyhow = "1"
rand = "0.9"
open = "5"
# 받아쓰기 pictures (Wikimedia Commons photos).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Japanese morphological analysis (IPADIC built in): readings for furigana and scoring, words,
# base forms and parts of speech. The dictionary is static data paged in on use (~5 MB resident).
lindera = { version = "6.2", default-features = false, features = ["embed-ipadic"] }
# 青空文庫 books: ZIP archives of Shift_JIS text.
zip = { version = "2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
# Natural Japanese speech (VOICEVOX, offline neural TTS). Its ONNX Runtime, dictionary and voice
# model are downloaded at first run (voicevox.rs); the runtime library is opened dynamically.
voicevox_core = { git = "https://github.com/VOICEVOX/voicevox_core.git", tag = "0.17.1", features = ["load-onnxruntime"] }
typed_floats = "1"
flate2 = "1"
tar = "0.4"

# Drawn with OpenGL (glow) everywhere but iOS, which has no OpenGL to speak of: there it is
# wgpu over Metal.
[target.'cfg(not(target_os = "ios"))'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[target.'cfg(target_os = "ios")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-foundation = "0.3"
block2 = "0.6"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }

# Not on Android, which has its own ways (android.rs, voice.rs, web.rs):
[target.'cfg(not(target_os = "android"))'.dependencies]
# The OS voice (macOS, Windows, iOS). On Android it needs a Java bridge class.
tts = "0.26"
# YouGlish videos inside the window (WKWebView on macOS / iOS, WebView2 on Windows). On Android
# it needs a Kotlin activity; there android/java/…/WebPane.java shows the system WebView.
wry = { version = "0.53", default-features = false, features = ["os-webview"] }

# Android (tablets and phones): the app runs in a NativeActivity; android.rs is its entry.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
jni = "0.21"
ndk-context = "0.1"

[dev-dependencies]
egui_kittest = { version = "0.31", features = ["eframe"] }
hound = "3.5"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-foundation = "0.3"
whisper-rs = { version = "0.14", features = ["metal"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev.package."*"]
opt-level = 2

[lib]
name = "speakup"
path = "src/lib.rs"

[package.metadata.bundle]
name = "SpeakUp 6M JP"
identifier = "com.speakup.sixmonths.japanese"
category = "Education"
short_description = "6개월 일본어 듣기·말하기 완성"
