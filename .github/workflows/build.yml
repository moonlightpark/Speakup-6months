# Builds SpeakUp 6M JP (the Japanese course, branch `japanese`) for macOS, Windows and Android on
# every push and publishes the packages to the "latest-japanese" GitHub release. Pushing a tag like
# ja-v2.0.0 also creates a versioned release.
name: build

on:
  push:
    branches: [japanese]
    tags: ["ja-v*"]
  workflow_dispatch:

permissions:
  contents: write

# A newer push supersedes a running build, so two runs never race to publish "latest".
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Windows libclang
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      - name: Test
        shell: bash
        run: cargo test --release

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ./scripts/bundle_macos.sh
          mkdir -p dist
          ditto -c -k --keepParent "target/release/SpeakUp 6M JP.app" "dist/SpeakUp6M-JP-${{ matrix.name }}.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release
          New-Item -ItemType Directory -Force dist | Out-Null
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item target/release/speakup.exe "pkg/SpeakUp6M-JP.exe"
          Get-ChildItem pkg
          Compress-Archive -Path pkg/* -DestinationPath "dist/SpeakUp6M-JP-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: SpeakUp6M-JP-${{ matrix.name }}
          path: dist/*

  # Android APK (phones and tablets). Signed with the app's release key from the secrets
  # ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASS, so installed apps update; skipped without them.
  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
    steps:
      - uses: actions/checkout@v4
        if: env.KEYSTORE_B64 != ''

      - uses: dtolnay/rust-toolchain@stable
        if: env.KEYSTORE_B64 != ''
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        if: env.KEYSTORE_B64 != ''
        with:
          key: android-arm64

      - name: Build APK
        if: env.KEYSTORE_B64 != ''
        run: |
          cargo install cargo-ndk --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks" ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" JOBS=4 sh scripts/build_android.sh
          mkdir -p dist && cp target/android/SpeakUp6M-JP-android-arm64.apk dist/

      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_B64 != ''
        with:
          name: SpeakUp6M-JP-android-arm64
          path: dist/*

  release:
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -la dist
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            gh release create "$TAG" dist/* --repo "$REPO" --title "SpeakUp 6M JP $TAG" --generate-notes --latest=false
          else
            # Rolling release that always holds the newest build of the japanese branch (not
            # marked "latest": that stays the English app's).
            gh release delete latest-japanese --repo "$REPO" --cleanup-tag --yes || true
            gh release create latest-japanese dist/* --repo "$REPO" --target "$GITHUB_SHA" --latest=false \
              --title "SpeakUp 6M JP · 일본어 (최신 빌드)" \
              --notes "japanese 브랜치 최신 커밋 ${GITHUB_SHA::7} 의 자동 빌드입니다. macOS(Apple Silicon) / Windows."
          fi
