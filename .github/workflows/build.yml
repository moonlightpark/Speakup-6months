# Builds SpeakUp 6M for macOS and Windows on every push to main and publishes the
# packages to the "latest" GitHub release. Pushing a tag like v1.2.0 also creates a versioned release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
    # The website (website/, deployed by pages.yml) doesn't need a new app build.
    paths-ignore: ["website/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

# A newer push supersedes a running build, so two runs never race to publish "latest".
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # sherpa-onnx's prebuilt libraries live in the user cache dir, outside target/.
      # Keep them cached, and rebuild sherpa-rs-sys if they are missing so a cached
      # target/ never links against files that aren't there.
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/sherpa-rs
            ~/AppData/Local/sherpa-rs
          key: sherpa-${{ matrix.name }}-${{ hashFiles('Cargo.lock') }}

      - name: Refresh sherpa-onnx if needed
        shell: bash
        run: |
          dir="$HOME/Library/Caches/sherpa-rs"
          [ "$RUNNER_OS" = "Windows" ] && dir="$LOCALAPPDATA/sherpa-rs"
          if [ ! -d "$dir" ]; then cargo clean --release -p sherpa-rs-sys; fi

      - name: Windows libclang
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      - name: Test
        shell: bash
        run: |
          cargo test --release --no-run
          if [ "$RUNNER_OS" = "Windows" ]; then
            # The test binary in deps/ needs the sherpa-onnx DLLs beside it, and a cached
            # target/ doesn't always have them (STATUS_DLL_NOT_FOUND).
            find "$(cygpath "$LOCALAPPDATA")/sherpa-rs" -name '*.dll' -exec cp {} target/release/deps/ \; -exec cp {} target/release/ \;
          fi
          cargo test --release

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ./scripts/bundle_macos.sh
          mkdir -p dist
          ditto -c -k --keepParent "target/release/SpeakUp 6M.app" "dist/SpeakUp6M-${{ matrix.name }}.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release
          New-Item -ItemType Directory -Force dist | Out-Null
          # The neural voice needs the sherpa-onnx / onnxruntime DLLs beside the .exe.
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item target/release/speakup.exe pkg/
          Copy-Item target/release/*.dll pkg/
          Get-ChildItem pkg
          Compress-Archive -Path pkg/* -DestinationPath "dist/SpeakUp6M-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: SpeakUp6M-${{ matrix.name }}
          path: dist/*

  # Android APK (phones and tablets). Signed with the app's release key from the secrets
  # ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASS, so installed apps update; skipped without them.
  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
    steps:
      - uses: actions/checkout@v4
        if: env.KEYSTORE_B64 != ''

      - uses: dtolnay/rust-toolchain@stable
        if: env.KEYSTORE_B64 != ''
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        if: env.KEYSTORE_B64 != ''
        with:
          key: android-arm64

      - name: Build APK
        if: env.KEYSTORE_B64 != ''
        run: |
          cargo install cargo-ndk --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          SHERPA_CACHE="$HOME/.cache/sherpa-rs" ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks" ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" JOBS=4 sh scripts/build_android.sh
          mkdir -p dist && cp target/android/SpeakUp6M-android-arm64.apk dist/

      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_B64 != ''
        with:
          name: SpeakUp6M-android-arm64
          path: dist/*

  release:
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -la dist
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            gh release create "$TAG" dist/* --repo "$REPO" --title "SpeakUp 6M $TAG" --generate-notes
          else
            # Rolling release that always holds the newest build of main.
            gh release delete latest --repo "$REPO" --cleanup-tag --yes || true
            gh release create latest dist/* --repo "$REPO" --target "$GITHUB_SHA" --latest \
              --title "SpeakUp 6M (최신 빌드)" \
              --notes "main 브랜치 최신 커밋 ${GITHUB_SHA::7} 의 자동 빌드입니다. macOS(Apple Silicon) / Windows."
          fi
